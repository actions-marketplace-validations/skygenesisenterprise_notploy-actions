name: Notploy Deployment
description: >-
  Deploy an application to a Notploy instance from GitHub Actions, wait for the
  result and report it back to the run (outputs, job summary, commit status).
author: Sky Genesis Enterprise

branding:
  icon: upload-cloud
  color: purple

inputs:
  endpoint:
    description: >-
      Base URL of the Notploy instance, for example
      `https://notploy.example.com`. Do not append `/api`: it is added
      automatically. Prefer HTTPS.
    required: true
  api-key:
    description: >-
      Notploy API key, sent as the `x-api-key` header. Store it as a repository
      or environment secret and reference that secret from the workflow; the
      value is masked in the logs.
    required: true
  application-id:
    description: >-
      Notploy application to deploy: its id, `appName`, or the name shown in
      the dashboard. All are accepted by both API surfaces.
    required: true
  api-mode:
    description: >-
      Which Notploy API to use. `auto` (default) prefers the CI/CD API and
      falls back to the classic endpoints when the instance or the credential
      has no CI/CD API; `cicd` requires it and fails instead of falling back;
      `legacy` only uses the classic endpoints.
    required: false
    default: auto
  project:
    description: >-
      Project the deployment belongs to (id or name), used to scope the CI/CD
      request when the token spans several projects. Ignored by the classic
      endpoints.
    required: false
  environment:
    description: >-
      Environment to deploy to (id or name), used to scope the CI/CD request.
      Ignored by the classic endpoints.
    required: false
  title:
    description: >-
      Deployment title shown in Notploy. Defaults to the workflow name, run
      number and commit. Maximum 200 characters.
    required: false
  description:
    description: >-
      Deployment description shown in Notploy. Defaults to the event, ref,
      actor and run id. Maximum 2000 characters.
    required: false
  metadata:
    description: >-
      Send the GitHub run context (repository, commit, ref, workflow, run) to
      Notploy, which links the deployment back to this run. Requires the CI/CD
      API, so `false` forces `api-mode: legacy`.
    required: false
    default: "true"
  idempotency-key:
    description: >-
      Key that makes this run equal exactly one deployment on the CI/CD API:
      retries of the same request replay the original deployment instead of
      queueing a second one. Defaults to `gha-<run id>-<run attempt>`. Has no
      effect on the classic endpoints, which are never retried.
    required: false
  wait:
    description: >-
      Wait for the deployment to reach a final state. When `false`, the step
      returns as soon as the deployment is accepted and the status output is
      `triggered`.
    required: false
    default: "true"
  timeout:
    description: >-
      Maximum time to wait for the deployment, as a Go duration (`30m`, `90s`,
      `1h`). Only used when `wait` is `true`.
    required: false
    default: 30m
  poll-interval:
    description: >-
      Delay between two deployment status lookups, as a Go duration (`5s`,
      `15s`). Minimum `1s`.
    required: false
    default: 5s
  cancel-on-timeout:
    description: >-
      Cancel the deployment in Notploy when the wait gives up or the job is
      cancelled, instead of leaving it running without anyone following it.
    required: false
    default: "false"
  log-tail:
    description: >-
      Number of log lines to read from a failed or cancelled deployment, printed
      in the step log and quoted in the job summary. `0` disables it. Maximum
      `5000` (the CI/CD API limit).
    required: false
    default: "100"
  github-token:
    description: >-
      Token used to publish a commit status for the deployment (requires the
      `statuses: write` permission, for example `permissions: { contents: read,
      statuses: write }`). Never use this as the `api-key`. The value is masked
      in the logs.
    required: false
  github-status-context:
    description: >-
      Context of the published commit status. Defaults to
      `notploy/<application-id>`; set it explicitly when several jobs deploy
      different applications from the same repository.
    required: false

outputs:
  deployment-id:
    description: >-
      Identifier of the Notploy deployment. Empty when the classic endpoints
      could not identify this run's deployment (they do not return it), or when
      the deployment was only triggered and not observed.
  deployment-status:
    description: >-
      Last observed status: `queued`, `running`, `done`, `error` or `cancelled`,
      or `triggered` when `wait` is `false`.
  deployment-url:
    description: >-
      Public URL of the application, when it has an enabled domain. Notploy does
      not expose a per-deployment URL.
  deployment-details-url:
    description: >-
      Link to the application's page in the Notploy dashboard, where its
      deployment logs are shown.
  deployment-logs-url:
    description: >-
      API endpoint returning this deployment's log (authentication required;
      the job summary is the human-readable alternative).
  deployment-environment:
    description: >-
      Name of the environment the deployment ran in, as reported by Notploy, or
      the `environment` input when the API surface does not report it.
  deployment-idempotent:
    description: >-
      `true` when the CI/CD API replayed an existing deployment instead of
      queueing a new one, `false` when it created one. Empty on the classic
      endpoints, which have no such concept.

runs:
  # A container action keeps the runtime self-contained: the Go binary is built
  # during the build of this image, so the runner needs neither Go nor Node.js.
  using: docker
  image: Dockerfile
