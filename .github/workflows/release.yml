name: Release

# Publishing is tag driven: pushing `v1.2.3` moves the floating `v1.2` and `v1`
# tags so workflows can pin a major (`@v1`) and still receive fixes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Move the floating tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The tags are pushed back to this repository with the workflow's
          # token, which is why the credentials are kept for this workflow only.
          persist-credentials: true

      - name: Update the floating tags
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          major="${tag%%.*}"
          minor="$(printf '%s' "${tag}" | cut -d. -f1,2)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for floating in "${major}" "${minor}"; do
            if [ "${floating}" = "${tag}" ]; then
              continue
            fi
            echo "Moving ${floating} to ${tag}"
            git tag -f "${floating}" "${tag}"
            git push --force origin "refs/tags/${floating}"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
