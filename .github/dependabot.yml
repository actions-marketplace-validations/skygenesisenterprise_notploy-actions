version: 2
updates:
  # Go modules (the action has no third-party dependencies today; this also
  # covers the tools the CI runs with `go run pkg@version` when they are added
  # to go.mod).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows of this repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
